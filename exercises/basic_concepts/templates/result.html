<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            margin-bottom: 1rem;
        }
        .user-card {
            background-color: #e9f5ff;
            padding: 1rem;
            border-radius: 6px;
            margin-top: 1rem;
        }
        .error {
            color: #c00;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        
        <h2>User Details</h2>
        <div class="user-card">
            <p><strong>ID:</strong> {{ user.id }}</p>
            <p><strong>Name:</strong> {{ user.name }}</p>
        </div>

    </div>
</body>
</html>
